services:
  master:
    image: ${RIVO_MASTER_IMAGE}:${RIVO_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: deploy/master/Dockerfile
      args:
        VERSION: ${RIVO_VERSION}
    container_name: ${RIVO_MASTER_CONTAINER}
    restart: unless-stopped
    command: ["-config", "/app/config.yaml"]
    environment:
      RIVO_DATABASE_DRIVER: ${RIVO_DATABASE_DRIVER}
      RIVO_DATABASE_DSN: ${RIVO_DATABASE_DSN}
      RIVO_DATABASE_AUTO_MIGRATE: ${RIVO_DATABASE_AUTO_MIGRATE}
      TZ: ${TZ}
    ports:
      - "${RIVO_HTTP_PORT}:8080"
      - "${RIVO_TCP_PORT}:9443"
    volumes:
      - type: bind
        source: ${RIVO_MASTER_CONFIG_FILE}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - master-data:/app/data
      - master-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    profiles: ["mysql"]
    image: mysql:${MYSQL_IMAGE_TAG}
    container_name: ${RIVO_MYSQL_CONTAINER}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  master-data:
  master-logs:
  mysql-data:
