services:
  agent:
    image: ${RIVO_AGENT_IMAGE:-ghcr.io/REPLACE_WITH_GITHUB_OWNER/rivo-agent:latest}
    container_name: ${RIVO_AGENT_CONTAINER:-rivo-agent}
    restart: unless-stopped
    command: ["-config", "/app/config.yaml"]
    network_mode: host
    pid: host
    user: "0:0"
    cap_add:
      - NET_RAW
    volumes:
      - type: bind
        source: ${RIVO_AGENT_CONFIG_FILE:-./config.yaml}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - agent-data:/app/data
      - agent-logs:/app/logs
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

volumes:
  agent-data:
  agent-logs:
