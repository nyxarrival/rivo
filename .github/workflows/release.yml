name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Build panel
        working-directory: panel
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed panel assets
        run: |
          rm -rf internal/master/web/dist
          mkdir -p internal/master/web/dist
          cp -R panel/dist/. internal/master/web/dist/

      - name: Build binary packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist/package dist/release

          for arch in amd64 arm64; do
            case "$arch" in
              amd64)
                cc="gcc"
                ;;
              arm64)
                cc="aarch64-linux-gnu-gcc"
                ;;
              *)
                echo "unsupported arch: $arch" >&2
                exit 1
                ;;
            esac

            master_dir="dist/package/rivo-master-linux-${arch}"
            agent_dir="dist/package/rivo-agent-linux-${arch}"
            mkdir -p "$master_dir" "$agent_dir"

            echo "Building linux/${arch} with ${cc}"
            CGO_ENABLED=1 GOOS=linux GOARCH="$arch" CC="$cc" \
              go build -trimpath -ldflags "-s -w" -o "$master_dir/rivo-master" ./cmd/master
            CGO_ENABLED=1 GOOS=linux GOARCH="$arch" CC="$cc" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$agent_dir/rivo-agent" ./cmd/agent

            cp configs/master.example.yaml "$master_dir/config.example.yaml"
            cp configs/agent.example.yaml "$agent_dir/config.example.yaml"
            cp LICENSE "$master_dir/LICENSE"
            cp LICENSE "$agent_dir/LICENSE"

            tar -C dist/package -czf "dist/release/rivo-master-linux-${arch}.tar.gz" "rivo-master-linux-${arch}"
            tar -C dist/package -czf "dist/release/rivo-agent-linux-${arch}.tar.gz" "rivo-agent-linux-${arch}"
          done

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum *.tar.gz > checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivo-release-binaries
          path: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
