name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Build Docker ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: rivo-master
            dockerfile: deploy/master/Dockerfile
          - name: rivo-agent
            dockerfile: deploy/agent/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image owner
        id: vars
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
          - target: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - target: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang -arch arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Build panel
        working-directory: panel
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed panel assets
        shell: bash
        run: |
          rm -rf internal/master/web/dist
          mkdir -p internal/master/web/dist
          cp -R panel/dist/. internal/master/web/dist/

      - name: Build binary packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail

          mkdir -p dist/package dist/release

          master_dir="dist/package/rivo-master-${GOOS}-${GOARCH}"
          agent_dir="dist/package/rivo-agent-${GOOS}-${GOARCH}"
          mkdir -p "$master_dir" "$agent_dir"

          echo "Building ${GOOS}/${GOARCH} with ${CC}"
          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" CC="$CC" \
            go build -trimpath -ldflags "-s -w" -o "$master_dir/rivo-master" ./cmd/master
          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" CC="$CC" \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$agent_dir/rivo-agent" ./cmd/agent

          cp configs/master.example.yaml "$master_dir/config.example.yaml"
          cp configs/agent.example.yaml "$agent_dir/config.example.yaml"
          cp LICENSE "$master_dir/LICENSE"
          cp LICENSE "$agent_dir/LICENSE"

          tar -C dist/package -czf "dist/release/rivo-master-${GOOS}-${GOARCH}.tar.gz" "rivo-master-${GOOS}-${GOARCH}"
          tar -C dist/package -czf "dist/release/rivo-agent-${GOOS}-${GOARCH}.tar.gz" "rivo-agent-${GOOS}-${GOARCH}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - docker

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum *.tar.gz > checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rivo-release-binaries
          path: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
