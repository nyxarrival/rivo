services:
  mysql:
    image: mysql:8.4
    container_name: rivo-mysql
    environment:
      MYSQL_DATABASE: rivo
      MYSQL_USER: rivo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-replace-with-database-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-with-root-database-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -urivo -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
